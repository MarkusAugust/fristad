# Netlify bygger ingenting selv. Wasm-bygget skjer i GitHub Actions, som
# laster opp ferdig `dist/` med Netlify CLI. Da bruker vi ingen byggeminutter
# på Netlify, selv om repoet er koblet til prosjektet.

[build]
  publish = "dist"
  ignore = "exit 0"

[[headers]]
  for = "/pkg/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
