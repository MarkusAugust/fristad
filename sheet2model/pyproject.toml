[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet2model"
version = "0.1.0"
description = "Rigget spillfigur fra et forbildeark (forfra, side, bak) med åpne verktøy: dybde, silhuetter, projisert tekstur, skjelett."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-image>=0.24",
  "opencv-python-headless>=4.10",
  "Pillow>=10",
  "onnxruntime>=1.20",
]

[project.optional-dependencies]
# Blender som Python-modul: desimering, uv, hull, skjelett og glb-eksport (ikke teksturen, den er numpy).
blender = ["bpy==4.2.*; python_version < '3.12'", "bpy>=5.0; python_version >= '3.13'"]
test = ["pytest>=8"]

[project.scripts]
sheet2model = "sheet2model.cli:main"

[tool.setuptools]
packages = ["sheet2model", "sheet2model.targets"]
package-dir = { "sheet2model" = "." }

[tool.setuptools.package-data]
sheet2model = ["examples/*/*.json", "README.md", "PROMPTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
