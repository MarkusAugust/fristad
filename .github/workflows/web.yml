name: Nettbygg

# Bygger bare når noe som påvirker nettversjonen er endret.
# Push til master publiserer hovedadressen. Push til claude/*-grener gir en
# forhåndsvisning på https://claude--fristad.netlify.app, så eieren kan teste
# før det går til master.
on:
  push:
    branches: [master, "claude/**"]
    paths:
      - "src/**"
      - "web/**"
      - "tools/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: nettbygg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ebbbcf71-5653-4288-821d-98495279f03c
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Bygg Fristad for nettleseren
        run: sh tools/build-web.sh
      # Den ferdige nettsiden (uten ressursene) legges på grenen web-dist, så
      # Claude kan hente den og kjøre den i Chromium i skymiljøet sitt.
      - name: Nettsiden til grenen web-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/distwt
          cd /tmp/distwt
          git checkout --orphan web-dist
          git rm -rfq . || true
          rsync -a --exclude assets "$GITHUB_WORKSPACE/dist/" .
          git add -A
          git commit -qm "Nettsiden bygd fra ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f origin web-dist
      - name: Publiser på Netlify (master)
        if: env.NETLIFY_AUTH_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx -y netlify-cli@latest deploy --prod --no-build --dir dist --site "$NETLIFY_SITE_ID" --message "${GITHUB_SHA::7}"
      - name: Forhåndsvisning på Netlify (claude--fristad.netlify.app)
        if: env.NETLIFY_AUTH_TOKEN != '' && github.ref != 'refs/heads/master'
        run: npx -y netlify-cli@latest deploy --no-build --dir dist --site "$NETLIFY_SITE_ID" --alias claude --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
      - name: Mangler Netlify-nøkkel
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::Legg inn NETLIFY_AUTH_TOKEN som secret i repoet for å publisere."
