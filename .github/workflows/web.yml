name: Nettbygg

# Bygger bare når noe som påvirker nettversjonen er endret.
# Push til master publiserer hovedadressen. Push til claude/*-grener gir en
# forhåndsvisning på https://claude--fristad.netlify.app, så eieren kan teste
# før det går til master.
on:
  push:
    branches: [master, "claude/**"]
    paths:
      - "src/**"
      - "crates/**"
      - "build.rs"
      - "web/**"
      - "tools/**"
      - "assets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: nettbygg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ebbbcf71-5653-4288-821d-98495279f03c
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Hurtiglager for teksturene fra Poly Haven
        uses: actions/cache@v4
        with:
          path: assets/external
          key: external-assets-${{ hashFiles('tools/fetch-assets.ts', 'assets/textures/**') }}
      # Teksturlagene før testene: `alle_lagene_har_bilde` krever dem.
      - name: Teksturlagene
        run: bun tools/fetch-assets.ts
      # Testene (arkitekturen, verden, krypten, fysikken, lydene) før noe
      # publiseres; feiler de, stopper bygget her.
      - name: Tester
        run: cargo test --release --workspace
      # Åpningsfilmen klippes ikke her: den klippes én gang med tools/film/cut.py
      # og legges ferdig på grenen `film` (tools/film/publish.sh), som hentes.
      - name: Åpningsfilmen fra grenen film
        run: |
          mkdir -p target/film
          if git fetch -q --depth 1 origin film; then
            git show FETCH_HEAD:intro.mp4 > target/film/intro.mp4
          else
            echo "::warning::Grenen film mangler; siden får ingen åpningsfilm."
          fi
      - name: Bygg Fristad for nettleseren
        run: sh tools/build-web.sh
      # Claude når ikke Poly Haven fra skymiljøet sitt, men når GitHub.
      # Teksturene legges derfor på grenen external-assets (bare filene,
      # uten historikk), som hentes med `sh tools/pull-assets.sh`.
      - name: Teksturene til grenen external-assets
        if: hashFiles('assets/external/manifest.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/extwt
          cd /tmp/extwt
          git checkout --orphan external-assets
          git rm -rfq . || true
          cp -r "$GITHUB_WORKSPACE/assets/external/." .
          git add -A
          git commit -qm "Teksturlag hentet $(date -u +%F) for ${GITHUB_SHA::7}"
          git push -f origin external-assets
      # Den ferdige nettsiden (uten teksturene og modellene) legges på grenen web-dist, så
      # Claude kan hente den og kjøre den i Chromium i skymiljøet sitt.
      - name: Nettsiden til grenen web-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git worktree add --detach /tmp/distwt
          cd /tmp/distwt
          git checkout --orphan web-dist
          git rm -rfq . || true
          rsync -a --exclude assets --exclude models "$GITHUB_WORKSPACE/dist/" .
          git add -A
          git commit -qm "Nettsiden bygd fra ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f origin web-dist
      - name: Publiser på Netlify (master)
        if: env.NETLIFY_AUTH_TOKEN != '' && github.ref == 'refs/heads/master'
        run: npx -y netlify-cli@latest deploy --prod --no-build --dir dist --site "$NETLIFY_SITE_ID" --message "${GITHUB_SHA::7}"
      - name: Forhåndsvisning på Netlify (claude--fristad.netlify.app)
        if: env.NETLIFY_AUTH_TOKEN != '' && github.ref != 'refs/heads/master'
        run: npx -y netlify-cli@latest deploy --no-build --dir dist --site "$NETLIFY_SITE_ID" --alias claude --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
      - name: Mangler Netlify-nøkkel
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::Legg inn NETLIFY_AUTH_TOKEN som secret i repoet for å publisere."
