name: Nettbygg

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Bygg Fristad for nettleseren
        run: sh tools/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fristad-web
          path: dist
